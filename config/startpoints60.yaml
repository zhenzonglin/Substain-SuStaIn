# ===== 一、30物理核的60个逻辑CPU；每折最多6个单线程官方起点 =====
# 60是请求上限。预检只允许10折×6起点；内存不足时拒绝切换，旧任务继续。
# 即使预检通过，MCMC阶段仍每折一条顺序链，running不会始终为60。
acceleration:
  backend: row_blocks
  block_rows: 32
  progress_enabled: true
  heartbeat_seconds: 5
  progress_filename: progress.json
  events_filename: progress_events.jsonl
preserve_acceleration: true
preserve_numerical_evaluation: true
require_existing_startpoint_parallel: true
preserve_completed_startpoints: true
numerical_evaluation:
  backend: logsumexp_v1
  block_rows: 32
  relative_tolerance: 0.0000000001
  absolute_log_tolerance: 0.00000001
  z_warning_threshold: 5
  top_features: 5
  heldout_dir: heldout_evaluation
startpoint_parallel:
  enabled: true
  workers_per_fold: 6
  fit_workers: 25
  physical_core_limit: 30
  logical_cpu_limit: 60
  worker_unit: logical_cpu
  checkpoint_dir: startpoints
  pool_progress_filename: progress_pool.json
  worker_overhead_gb: 0.25

# ===== 二、只从已验证的已发布版本迁移；科学身份、原链及完整起点均保留 =====
